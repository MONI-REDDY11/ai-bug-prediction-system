<!DOCTYPE html>
<html>
<head>
    <title>AI Bug Prediction System</title>
</head>
<body>
    <h1>AI Bug Prediction System</h1>

    <form action="/predict" method="POST">
        <p>
            <label for="lines_of_code">Lines of Code:</label><br>
            <input type="number" id="lines_of_code" name="lines_of_code" required value="{{ lines_of_code or '' }}">
        </p>

        <p>
            <label for="complexity">Complexity:</label><br>
            <input type="number" id="complexity" name="complexity" required value="{{ complexity or '' }}">
        </p>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <p><strong>Prediction:</strong> {{ prediction }}</p>
    {% endif %}
</body>
</html>
