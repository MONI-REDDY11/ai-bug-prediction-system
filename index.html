<!DOCTYPE html>
<html>
<head>
    <title>AI Bug Prediction System</title>
</head>
<body>
    <h1>AI Bug Prediction System</h1>

    <form method="POST">
        <label>Lines of Code:</label><br>
        <input type="number" name="loc" value="{{ loc or '' }}" required>
        <br><br>

        <label>Complexity:</label><br>
        <input type="number" name="complexity" value="{{ complexity or '' }}" required>
        <br><br>

        <button type="submit">Predict</button>
    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    {% if risk %}
        <p style="color:green;">Risk Level: {{ risk }}</p>
    {% endif %}
</body>
</html>
