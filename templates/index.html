<!DOCTYPE html>
<html>
<head>
    <title>AI Bug Prediction System</title>
</head>
<body>
    <h1>AI Bug Prediction System</h1>

    <form method="POST" action="/predict">
        <label>Lines of Code:</label>
        <input type="number" name="lines_of_code" required>
        <br><br>

        <label>Complexity:</label>

        <button type="submit">Predict</button>
    </form>
</body>
</html>
